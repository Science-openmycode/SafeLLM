[project]
name = "aloepri"
version = "0.2.0"
description = "Weight and token-space transformation tooling for private LLM inference"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "accelerate==1.14.0",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "huggingface-hub==1.19.0",
  "numpy>=2.0,<3",
  "orjson>=3.10,<4",
  "pydantic>=2.10,<3",
  "pyyaml>=6.0,<7",
  "safetensors>=0.5,<1",
  "torch==2.9.1",
  "transformers==5.12.0",
  "typer>=0.16,<1",
  "uvicorn>=0.35,<1",
]

[project.scripts]
aloepri = "aloepri.cli:app"

[project.entry-points."vllm.general_plugins"]
aloepri = "aloepri.serving.vllm_plugin:register"

[project.optional-dependencies]
eval = [
  "datasets==5.0.0",
  "evaluate==0.4.6",
  "lm-eval>=0.4.9,<0.5",
  "langdetect>=1.0.9,<2",
  "immutabledict>=4,<5",
  "nltk==3.9.2",
]

[dependency-groups]
dev = [
  "hypothesis>=6.130,<7",
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
  "types-PyYAML>=6.0,<7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aloepri"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["aloepri"]

[[tool.mypy.overrides]]
module = [
  "aloepri.attacks.mapping",
  "aloepri.conversion.paper_qwen2",
  "aloepri.conversion.vocab_checkpoint",
  "aloepri.eval.lm_eval_private",
  "aloepri.models.toy",
  "aloepri.models.configuration_aloepri_qwen2",
  "aloepri.models.modeling_aloepri_qwen2",
  "aloepri.serving.hf_runtime",
  "aloepri.serving.sglang_models",
  "aloepri.serving.sglang_models.*",
  "aloepri.serving.vllm_plugin",
  "aloepri.serving.vllm_qwen2",
  "aloepri.transforms.pq",
  "aloepri.transforms.paper_key_matrix",
  "aloepri.transforms.qwen_structural",
  "aloepri.transforms.rms_calibration",
]
ignore_errors = true
