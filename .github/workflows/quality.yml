name: quality

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version-file: .python-version

      - name: Synchronize locked environment
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check src scripts tests

      - name: Type check
        run: uv run mypy src

      - name: Test
        run: uv run pytest -q
