limit_req_zone $binary_remote_addr zone=aloepri_api:10m rate=5r/s;

server {
    listen 443 ssl http2;
    server_name ALOEPRI_DOMAIN;

    ssl_certificate /etc/letsencrypt/live/ALOEPRI_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ALOEPRI_DOMAIN/privkey.pem;
    client_max_body_size 1m;

    location / {
        limit_req zone=aloepri_api burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 600s;
    }
}
